group = "dev.britannio.in_app_review"
version = "1.0-SNAPSHOT"

//AGP 9 only, so no `kotlin-android` plugin and no compat guard: with AGP's built-in Kotlin (the default) AGP compiles
//the Kotlin sources, and a host that opts out with `android.builtInKotlin=false` gets the plugin applied by Flutter
//itself (`FlutterPluginUtils.detectApplyingKotlinGradlePlugin`, since 3.44 — hence the Flutter floor in pubspec.yaml).
apply plugin: "com.android.library"

android {
    namespace = "dev.britannio.in_app_review"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
        // Release notes: https://developer.android.com/reference/com/google/android/play/core/release-notes-in_app_reviews
        implementation 'com.google.android.play:review:2.0.2'
        implementation 'com.google.android.play:review-ktx:2.0.2'
        // Release notes: https://developers.google.com/android/guides/releases
        implementation 'com.google.android.gms:play-services-base:18.7.2'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

//jvmTarget has to match `compileOptions` above: under built-in Kotlin AGP fails the build when the two differ, and
//Kotlin otherwise follows the JDK toolchain (https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors)
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
